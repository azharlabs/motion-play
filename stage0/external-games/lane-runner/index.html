<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <title>MotionPlay Lane Runner</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-rounded, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #020617; color: #f8fafc; overflow: hidden; }
    #wrap { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #chrome {
      position: absolute; inset: 0 0 auto 0; display: flex; gap: 12px; align-items: center;
      justify-content: space-between; padding: 10px 14px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(2,6,23,.75), transparent);
    }
    .pill {
      background: rgba(15,23,42,.75); border: 1px solid #334155; border-radius: 999px;
      padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    #status { font-size: 12px; color: #cbd5e1; max-width: 46vw; text-align: right; }
    #overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(2,6,23,.55); padding: 24px; text-align: center; cursor: pointer;
    }
    #overlay[hidden] { display: none !important; }
    #overlay-card {
      width: min(420px, 100%); border-radius: 24px; padding: 22px 20px;
      background: #111c2d; border: 1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    #overlay-title { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); }
    #overlay-body { margin: 0; color: #cbd5e1; line-height: 1.45; }
    #overlay-card::after {
      content: "MotionPlay"; display: block; margin-top: 16px; color: #f97316;
      font-weight: 800; letter-spacing: .04em; font-size: 12px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Lane runner game"></canvas>
    <div id="chrome">
      <div class="pill">Score <span id="score">0</span></div>
      <div id="status">Waiting for MotionPlay…</div>
      <div class="pill">Best <span id="best">0</span></div>
    </div>
    <div id="overlay">
      <div id="overlay-card">
        <h1 id="overlay-title">Lane Runner</h1>
        <p id="overlay-body">Loading…</p>
      </div>
    </div>
  </div>
  <script src="./key-bridge.js"></script>
  <script src="./game.js"></script>
</body>
</html>
