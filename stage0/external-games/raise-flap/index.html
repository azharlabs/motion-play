<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <title>MotionPlay — Space Defender</title>
  <!-- Root-absolute assets: Vercel trailingSlash=false serves /slug without a
       trailing slash, which breaks ../ and ./ relative URLs in the embed. -->
  <base href="/external-games/raise-flap/" />
  <link rel="stylesheet" href="/external-games/_shared/shell.css" />
  <style>:root { --accent: #14b8a6; }</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Space Defender"></canvas>
    <div id="chrome">
      <div class="pill">Score <span id="score">0</span></div>
      <div id="status">Tap / keys ready</div>
      <div class="pill">Best <span id="best">0</span></div>
    </div>
    <div id="overlay">
      <div id="overlay-card">
        <h1 id="overlay-title">Space Defender</h1>
        <p id="overlay-body">Tap or press Space to start · keyboard works without camera</p>
      </div>
    </div>
  </div>
  <script src="/external-games/_shared/key-bridge.js"></script>
  <script src="/external-games/_shared/mini.js"></script>
  <script src="/external-games/raise-flap/game.js"></script>
</body>
</html>
