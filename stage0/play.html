<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <meta name="theme-color" content="#0d2a26" />
  <title>MotionPlay — Play</title>
  <link rel="stylesheet" href="./css/play-chrome.css" />
</head>
<body>
  <div id="play-shell">
    <header class="play-head">
      <a href="./controller.html" class="mp-home mp-home-play" id="home-logo-play" aria-label="MotionPlay home">
        <canvas id="logo-mascot-play" class="logo-mascot" width="80" height="80" aria-hidden="true"></canvas>
        <span class="mp-wordmark">Motion<span>Play</span></span>
      </a>
      <div class="play-title-wrap">
        <h1 id="game-title">Motion<span>Play</span></h1>
      </div>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <div class="links">
        <a id="back-home" href="./controller.html">All games</a>
      </div>
    </header>

    <div id="stage">
      <section id="camera-pane" aria-label="Motion camera">
        <div class="camera">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay" class="overlay"></canvas>
        </div>
      </section>
      <section id="game-pane" aria-label="Sticky mini-game">
        <iframe
          id="game-frame"
          title="MotionPlay game"
          src="./external-games/lane-runner/"
          allow="fullscreen"
        ></iframe>
      </section>
    </div>

    <div id="status">Game ready — tap / keys work without camera. Start enables optional body controls.</div>
    <div class="fine play-fine">Same-origin iframe + key/pose bridge. Camera stays on-device.</div>
    <div id="counts" aria-hidden="true"></div>
  </div>
  <script type="module" src="./js/external/controller-main.js"></script>
</body>
</html>
